name: Prepara i quadretti

# Una volta al mese (il 2, di notte) e quando vuoi con "Run workflow": scarica da Geofabrik le regioni di
# regioni.txt, tiene solo strade e sentieri, prepara i quadretti e li pubblica come release "latest".
on:
  schedule:
    - cron: '17 2 2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quadretti
  cancel-in-progress: false

jobs:
  quadretti:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti (osmium)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install --quiet osmium

      - name: Scarica le regioni da Geofabrik e tiene solo strade e sentieri
        run: |
          set -euo pipefail
          mkdir -p dati
          nomi=()
          while read -r r nome <&3; do
            [ -z "$r" ] && continue
            case "$r" in \#*) continue;; esac
            f="dati/$(echo "$r" | tr '/' '_').osm.pbf"
            echo "::group::$r"
            curl -fsSL --retry 5 --retry-delay 30 -o "$f" "https://download.geofabrik.de/$r-latest.osm.pbf"
            curl -fsSL --retry 5 --retry-delay 30 -o "$f.md5" "https://download.geofabrik.de/$r-latest.osm.pbf.md5"
            echo "$(cut -d' ' -f1 "$f.md5")  $f" | md5sum -c -
            ls -la "$f"
            osmium tags-filter --overwrite -o "${f%.osm.pbf}.vie.osm.pbf" "$f" w/highway
            rm "$f"
            echo "::endgroup::"
            nomi+=("${nome:-$(basename "$r")}")
          done 3< regioni.txt
          osmium merge --overwrite -o dati/vie.osm.pbf dati/*.vie.osm.pbf
          ls -la dati
          echo "REGIONI=$(IFS=,; echo "${nomi[*]}" | sed 's/,/, /g')" >> "$GITHUB_ENV"

      - name: Prepara i quadretti
        run: |
          echo "DATA=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          python3 quadretti.py dati/vie.osm.pbf quadretti --data "$(date -u +%Y-%m-%d)" --regioni "$REGIONI"
          du -sh quadretti
          ls quadretti | wc -l

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub a volte risponde "504 couldn't respond in time": riprovo fino a 5 volte, aspettando sempre di più
          riprova() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "Tentativo $i non riuscito: riprovo tra $((i * 30)) secondi."
              sleep $((i * 30))
            done
            return 1
          }
          # se un tentativo "fallito" in realtà è andato a buon fine, ripeterlo non deve fare danni
          crea() {
            gh release view "$tag" >/dev/null 2>&1 && return 0
            gh release create "$tag" --draft --title "Quadretti del $DATA" \
              --notes "Strade e sentieri di OpenStreetMap ($REGIONI), dati Geofabrik del $DATA. © OpenStreetMap contributors, licenza ODbL."
          }
          elimina() {
            gh release view "$1" >/dev/null 2>&1 || return 0
            gh release delete "$1" --yes --cleanup-tag
          }
          tag="dati-$DATA-${GITHUB_RUN_NUMBER}"
          # prima in bozza: l'app vede la release solo quando ha tutti i file
          riprova crea
          # a gruppi di 50 file; --clobber rende sicuro ricaricare un gruppo già caricato a metà
          cd quadretti
          ls > ../file.txt
          split -l 50 ../file.txt ../gruppo-
          for g in ../gruppo-*; do
            riprova xargs -a "$g" gh release upload "$tag" --clobber
          done
          cd ..
          riprova gh release edit "$tag" --draft=false --latest
          echo "Release $tag pubblicata."

          # pulizia: le bozze rimaste da giri falliti e le release vecchie (tiene le ultime 3). Se GitHub non risponde
          # non è grave: i dati nuovi sono già pubblicati e la pulizia si rifà al prossimo giro.
          {
            gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | grep -vx "$tag" || true
            gh release list --limit 100 --json tagName,isDraft,isLatest --jq '.[] | select((.isDraft or .isLatest) | not) | .tagName' | tail -n +3
          } > vecchie.txt || echo "::warning::Elenco delle release non letto: la pulizia si rifà al prossimo giro."
          while read -r vecchia; do
            [ -n "$vecchia" ] || continue
            riprova elimina "$vecchia" \
              || echo "::warning::Release $vecchia non cancellata: ci riprovo al prossimo giro."
          done < vecchie.txt
